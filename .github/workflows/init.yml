name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qtbase5-dev \
          qt5-qmake \
          build-essential \
          debhelper \
          dh-autoreconf \
          liblzma-dev \
          fakeroot \
          wget

    - name: Download xdelta3 source
      run: |
        mkdir xdelta-build
        cd xdelta-build
        apt-get source xdelta3

    - name: Build and install xdelta3 from source
      run: |
        cd xdelta-build/xdelta3-*
        dpkg-buildpackage -uc -us -b
        sudo dpkg -i ../xdelta3_*.deb

    - name: Build Utils library
      run: |
        cd UTILS
        qmake UTILS.pro
        make

    - name: Build and run tests
      run: |
        cd tests
        qmake tests.pro
        make
        ./test_utils
