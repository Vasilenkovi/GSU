name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qt5-qmake build-essential wget

    - name: Build and install xdelta3 from source
      run: |
        wget https://raw.githubusercontent.com/jmacd/xdelta/master/xdelta3/xdelta3.c
        wget https://raw.githubusercontent.com/jmacd/xdelta/master/xdelta3/xdelta3.h
        sudo cp xdelta3.h /usr/local/include/
        gcc -c xdelta3.c -o xdelta3.o
        ar rcs libxdelta3.a xdelta3.o
        sudo cp libxdelta3.a /usr/local/lib/
        sudo ldconfig

    - name: Build Utils library
      run: |
        cd UTILS
        qmake UTILS.pro
        make

    - name: Build and run tests
      run: |
        cd tests
        qmake tests.pro
        make
        ./test_utils
