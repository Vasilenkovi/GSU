name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Conan
      run: pip install conan

    - name: Setup Conan profile
      run: |
        mkdir -p ~/.conan2
        cp .github/conan/conan.yaml ~/.conan2/global.conf
        conan profile detect --force

    - name: Install HDiffPatch via Conan
      run: |
        conan create recipes/hdiffpatch --build=missing --profile=.github/conan/profiles/default.yml

    - name: Deploy HDiffPatch to include directory
      run: |
        # Get the package folder from Conan cache
        PKG_FOLDER=$(conan list hdiffpatch/1.0.0 --format=json | python3 -c "import sys, json; print(json.load(sys.stdin)['hdiffpatch/1.0.0']['package_folder'])")
        # Copy to expected location
        mkdir -p include
        cp -r "$PKG_FOLDER"/* include/HDiffPatch/

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qt5-qmake build-essential git

    - name: Build Utils library
      run: |
        cd UTILS
        qmake UTILS.pro
        make

    - name: Build and run tests
      run: |
        cd tests
        qmake tests.pro
        make
        ./test_utils
