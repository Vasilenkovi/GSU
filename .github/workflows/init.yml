name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install basic deps
      run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qt5-qmake build-essential wget pkgconf

    - name: Install xdelta3 and build library
      run: |
        sudo apt-get install -y xdelta3
        wget https://github.com/jmacd/xdelta/releases/download/3.1.0/xdelta3-3.1.0.tar.gz
        tar xvf xdelta3-3.1.0.tar.gz
        cd xdelta3-3.1.0
        ./configure
        make
        sudo make install

    - name: Build Utils library
      run: |
        cd UTILS
        qmake UTILS.pro
        make

    - name: Build and run tests
      run: |
        cd tests
        qmake tests.pro
        make
        ./test_utils
