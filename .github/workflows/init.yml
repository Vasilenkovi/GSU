name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          debhelper \
          dh-autoreconf \
          qtbase5-dev \
          qt5-qmake \
          liblzma-dev \
          fakeroot \
          wget \
          automake \
          autoconf \
          libtool

    - name: Build and install xdelta3
      run: |
        wget https://github.com/jmacd/xdelta/archive/refs/tags/v3.1.0.tar.gz
        tar -xzvf v3.1.0.tar.gz
        cd xdelta-3.1.0
        cd xdelta3
        # Generate build files using autotools
        autoreconf -fvi
        ./configure
        make
        sudo make install

    - name: Build Utils library
      run: |
        cd UTILS
        qmake UTILS.pro
        make

    - name: Build and run tests
      run: |
        cd tests
        qmake tests.pro
        make
        ./test_utils
