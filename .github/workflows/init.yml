name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qt5-qmake libxdelta-dev

    - name: Build Utils library
      run: |
        cd UTILS
        qmake UTILS.pro
        make

    - name: Build and run tests
      run: |
        cd tests
        qmake tests.pro
        make
        ./test_utils
