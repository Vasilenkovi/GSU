name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enable source repositories
      run: |
        sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
        sudo apt-get update

    - name: Install build dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          debhelper \
          dh-autoreconf \
          qtbase5-dev \
          qt5-qmake \
          liblzma-dev \
          fakeroot \
          wget

    - name: Build and install xdelta3
      run: |
        git clone https://github.com/jmacd/xdelta.git
        cd xdelta/xdelta3
        # Generate build files using autotools
        ./bootstrap  # or: libtoolize && aclocal -I m4 && autoheader && automake --add-missing && autoconf
        # Configure and build
        ./configure --prefix=/usr/local
        make -j$(nproc)
        # Install
        sudo make install

    - name: Build Utils library
      run: |
        cd UTILS
        qmake UTILS.pro
        make

    - name: Build and run tests
      run: |
        cd tests
        qmake tests.pro
        make
        ./test_utils
